name: Android development QA

on:
  push:
    branches:
      - alpha-39-88-beta-readiness
      - beta-2-development
    paths:
      - 'app/**'
      - '.github/workflows/android-development-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Compile Android instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Confirm test APK is NOT an update APK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          echo "::warning::CI debug APK uses a temporary signer. Do not use it to update an installed release."
      - name: Upload debug APK (isolated only)
        uses: actions/upload-artifact@v4
        with:
          name: Evolufisico-DEV-DEBUG-NAO-ATUALIZAVEL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
