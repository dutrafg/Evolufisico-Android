name: EvoluFisico Android signed release (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolufisico-android-release
  cancel-in-progress: false

jobs:
  signed-apk:
    # No distribution before all QA acceptance tasks pass.
    if: ${{ vars.EF_APK_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android 36 platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Load stable signing key from protected secrets
        shell: bash
        env:
          EF_KEYSTORE_BASE64: ${{ secrets.EF_KEYSTORE_BASE64 }}
          EF_RELEASE_STORE_PASSWORD: ${{ secrets.EF_RELEASE_STORE_PASSWORD }}
          EF_RELEASE_KEY_ALIAS: ${{ secrets.EF_RELEASE_KEY_ALIAS }}
          EF_RELEASE_KEY_PASSWORD: ${{ secrets.EF_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$EF_KEYSTORE_BASE64" || { echo "::error::Signing keystore secret missing"; exit 1; }
          test -n "$EF_RELEASE_STORE_PASSWORD" || { echo "::error::Signing store password missing"; exit 1; }
          test -n "$EF_RELEASE_KEY_ALIAS" || { echo "::error::Signing key alias missing"; exit 1; }
          test -n "$EF_RELEASE_KEY_PASSWORD" || { echo "::error::Signing key password missing"; exit 1; }
          umask 077
          printf '%s' "$EF_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/evolufisico-release.jks"
          test -s "$RUNNER_TEMP/evolufisico-release.jks"
      - name: Test, lint and assemble signed release
        env:
          EF_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/evolufisico-release.jks
          EF_RELEASE_STORE_PASSWORD: ${{ secrets.EF_RELEASE_STORE_PASSWORD }}
          EF_RELEASE_KEY_ALIAS: ${{ secrets.EF_RELEASE_KEY_ALIAS }}
          EF_RELEASE_KEY_PASSWORD: ${{ secrets.EF_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Verify package signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Remove secret signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/evolufisico-release.jks"
      - name: Publish verified signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvoluFisico-Android-Signed-Release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
