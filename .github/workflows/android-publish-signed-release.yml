name: Publish signed Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.10.0-alpha)"
        required: true
        default: "v0.20.1-alpha"

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then MANAGER="$(command -v sdkmanager)"; fi
          yes | "$MANAGER" --licenses > /dev/null || true
          "$MANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Prepare secret signing identity
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.EF_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EF_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EF_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EF_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing stable signing key secrets. No release will be published."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ef-distribution.jks"
          chmod 600 "$RUNNER_TEMP/ef-distribution.jks"
          {
            echo "EF_KEYSTORE_FILE=$RUNNER_TEMP/ef-distribution.jks"
            echo "EF_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "EF_KEY_ALIAS=$KEY_ALIAS"
            echo "EF_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build and validate signed release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          PACKAGE_INFO="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n '1p')"
          [[ "$PACKAGE_INFO" == *"versionName='${TAG#v}'"* ]] || {
            echo "Tag does not match APK versionName"; exit 1;
          }
          CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$CERT"
          printf '%s\n' "$CERT" > Evolufisico-Android-release.cert.sha256
          cp "$APK" Evolufisico-Android-release.apk
          sha256sum Evolufisico-Android-release.apk > Evolufisico-Android-release.apk.sha256
      - name: Reject changed signing key from previous release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS="$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // ""')"
          if [ -n "$PREVIOUS" ]; then
            mkdir -p "$RUNNER_TEMP/previous-release"
            gh release download "$PREVIOUS" --pattern 'Evolufisico-Android-release.cert.sha256' \
              --dir "$RUNNER_TEMP/previous-release"
            cmp "$RUNNER_TEMP/previous-release/Evolufisico-Android-release.cert.sha256" \
              Evolufisico-Android-release.cert.sha256 || {
              echo "Signing certificate changed! Update would erase installation continuity."
              exit 1
            }
          fi
      - name: Publish GitHub Release after signature verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha|-beta|-rc[0-9]+)?$ ]] || {
            echo "Invalid release tag"; exit 1;
          }
          gh release create "$TAG" Evolufisico-Android-release.apk \
            Evolufisico-Android-release.apk.sha256 \
            Evolufisico-Android-release.cert.sha256 \
            --title "EvoluFísico Android $TAG" --prerelease \
            --notes "Android native signed release. Use the in-app updater; Android verifies the installed signing identity. Export an encrypted backup before updating."
      - name: Remove private keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ef-distribution.jks"
