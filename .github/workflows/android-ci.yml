name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build APK and unit tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Compile Android instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest
      - name: Android Lint
        run: gradle --no-daemon :app:lintDebug
      - name: Compile unsigned release AAB
        run: gradle --no-daemon :app:bundleRelease
      - name: Print debug certificate for diagnostic comparison
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk |
            grep -E "Signer #1 certificate SHA-256 digest|Signer #1 certificate DN"
          echo "::warning::DEBUG APK uses ephemeral CI signing. It cannot update a different run or official RELEASE."
      - name: Upload tested debug APK (NOT UPDATEABLE)
        uses: actions/upload-artifact@v4
        with:
          name: Evolufisico-Android-QA-DEBUG-NAO-ATUALIZAVEL
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload unsigned release bundle (not for distribution)
        uses: actions/upload-artifact@v4
        with:
          name: Evolufisico-Android-UNSIGNED-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
