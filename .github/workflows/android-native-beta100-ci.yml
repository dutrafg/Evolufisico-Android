name: Android Native Beta 100 Revision 3 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-beta100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Static and visual contract checks
        run: |
          python3 qa/check_source.py
          python3 qa/check_window_contract.py
          python3 qa/check_palette.py
      - name: Verify Gradle wrapper
        run: bash gradlew --version
      - name: Unit tests, lint, and debug APK
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Publish debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvoluFisico-Nativo-Beta100-Rev3-debug-nao-atualizavel
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
