name: Android native verification

on:
  push:
    branches: [main, "native/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit and database tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Inspect Android lint issues
        run: gradle --no-daemon :app:lintDebug
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Publish Android Beta 17 test APK
        uses: actions/upload-artifact@v4
        with:
          name: EvoluFisico-Android-Beta17-Test-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
