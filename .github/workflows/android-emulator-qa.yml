name: Android Emulator QA (manual)

on:
  workflow_dispatch:
  push:
    branches: [ main, beta-2-development, beta-3-development, beta-4-development, beta-5-development, beta-6-visual-redesign, beta-7-mockup-core, beta-8-mockup-modules, beta-9-mockup-polish, beta-10-parity-review, beta-11-interface-polish ]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/android-emulator-qa.yml'

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=podman"' |
          sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute instrumented tests on clean Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_5
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # O runner executa cada linha como um shell separado: usar comando unico.
          script: bash -c 'gradle --no-daemon :app:connectedDebugAndroidTest; result=$?; mkdir -p app/build/visual-qa; adb pull /sdcard/Android/data/br.com.evolufisico.android.beta11/files/visual-qa/. app/build/visual-qa/ || true; exit "$result"'
      - name: Upload Beta 11 visual captures and instrumentation reports
        if: always() && github.ref == 'refs/heads/beta-11-interface-polish'
        uses: actions/upload-artifact@v4
        with:
          name: Evolufisico-Beta11-QA-Visual
          path: |
            app/build/visual-qa/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
